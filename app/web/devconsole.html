<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>CrossPet 開發者控制台</title>
<style>
:root { --bg: #f6f3ee; --panel: #fff; --ink: #3b2a22; --muted: #8a7a70; --line: #e7dfd5; --accent: #c8792f;
  --ok: #2f9e5b; --bad: #d64545; --warn: #e0a100; }
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; color: var(--ink); background: var(--bg); display: flex; height: 100vh; }
button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.on { background: #fff3e4; border-color: var(--accent); }
input[type=text], textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; width: 100%; background: #fffdfa; color: var(--ink); }
aside { width: 170px; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; flex-shrink: 0; }
aside h3 { font-size: 11px; color: var(--muted); margin: 10px 6px 4px; font-weight: 600; }
.char { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; cursor: pointer; }
.char:hover { background: #faf5ee; }
.char.sel { background: #fff0e0; }
.char img { width: 34px; height: 34px; object-fit: contain; }
.char .n { font-weight: 600; }
.char .c { font-size: 11px; color: var(--muted); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { margin-top: 6px; font-size: 12px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; background: #f1ebe3; color: var(--muted); }
.pill.fb { background: #fff4d6; color: #9a6b00; }
.pill.bad { background: #fde8e8; color: var(--bad); }
.pill.ok { background: #e3f5ea; color: var(--ok); }
nav { display: flex; gap: 4px; margin-top: 10px; }
nav button { border-radius: 7px 7px 0 0; border-bottom: none; }
nav button.sel { background: var(--bg); border-color: var(--line); font-weight: 600; }
section { flex: 1; overflow: auto; padding: 14px; display: none; }
section.sel { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.tile.playing { outline: 2px solid var(--accent); }
.tile.mark-ok { border-color: #9fd8b3; }
.tile.mark-bad { border-color: #f0a3a3; background: #fffafa; }
.thumb { height: 150px; border-radius: 7px; background: repeating-conic-gradient(#f3eee8 0 25%, #fbf8f4 0 50%) 0 0/16px 16px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
.thumb img { max-height: 100%; max-width: 100%; object-fit: contain; }
.thumb .missing { align-self: center; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
.tname { font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.tname code { font-size: 12px; }
.when { font-size: 11px; color: var(--muted); min-height: 16px; }
.line { font-size: 12px; color: #6b4a3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marks { display: flex; gap: 4px; align-items: center; }
.marks button { padding: 1px 8px; }
.marks button.ok.on { background: #e3f5ea; border-color: var(--ok); color: var(--ok); }
.marks button.bad.on { background: #fde8e8; border-color: var(--bad); color: var(--bad); }
.note { display: none; }
.mark-bad .note, .note.show { display: block; }
.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 230px; gap: 10px; }
.scene.mark-ok { border-color: #9fd8b3; }
.scene.mark-bad { border-color: #f0a3a3; background: #fffafa; }
.scene h4 { margin: 0 0 3px; font-size: 14px; }
.scene .exp { color: var(--muted); font-size: 12px; }
.scene .exp b { color: var(--ink); font-weight: 500; }
.scene .side { display: flex; flex-direction: column; gap: 6px; }
.scene .prog { font-size: 11px; color: var(--accent); min-height: 16px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
td, th { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; vertical-align: top; }
th { color: var(--muted); font-weight: 600; background: #fbf8f4; }
td code { font-size: 11px; word-break: break-all; }
.hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
textarea { min-height: 300px; font: 12px/1.5 ui-monospace, Menlo, monospace; }
.sum { display: flex; gap: 14px; margin-bottom: 10px; }
.sum div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.sum b { font-size: 20px; display: block; }
</style></head>
<body>
<aside>
  <h3>角色</h3><div id="chars"></div>
  <h3>彩蛋</h3><div id="eggs"></div>
</aside>
<main>
  <header>
    <div class="row">
      <b style="font-size:15px">CrossPet 開發者控制台</b><span class="pill" id="ver"></span>
      <span style="flex:1"></span>
      <button id="pause" class="on" title="測試時先不把真實 AI 的狀態交給桌寵（事件仍會記在「即時事件」裡）">⏸ 暫停真實 AI 事件</button>
      <button id="release" title="鬆開保持，桌寵回到正常執行">↩︎ 讓桌寵恢復正常</button>
      <button id="reloadPet">⟳ 重新載入桌寵</button>
    </div>
    <div class="status" id="status">桌寵狀態讀取中…</div>
    <nav>
      <button data-tab="poses" class="sel">姿態</button>
      <button data-tab="scenes">場景演練</button>
      <button data-tab="events">即時事件</button>
      <button data-tab="feedback">反饋 <span class="pill" id="badCount">0</span></button>
    </nav>
  </header>

  <section id="poses" class="sel">
    <div class="row" style="margin-bottom:10px">
      <button id="tour" class="primary">▶ 逐個輪播這個角色的全部姿態</button>
      <span class="hint" style="margin:0">點縮圖 = 讓桌寵演這一張並保持住。看完在卡片上點 ✓ 或 ✗，✗ 可以寫一句哪裡不對。鍵盤 ← → 切換上一張 / 下一張。</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="scenes">
    <p class="hint">用和真實 AI 一樣的事件流程跑一遍，看銜接、時機、臺詞、特效對不對。場景只作用於左邊選中的角色；執行期間建議保持「暫停真實 AI 事件」。</p>
    <div id="sceneList"></div>
  </section>

  <section id="events">
    <p class="hint">真實 AI 寫給桌寵的狀態（/tmp/crosspet/）。暫停時這裡照常記錄，但不會交給桌寵。用來排查「AI 在幹活、桌寵卻沒反應」。</p>
    <table><thead><tr><th style="width:70px">時間</th><th style="width:80px">角色</th><th style="width:50px">型別</th><th>內容</th><th style="width:60px"></th></tr></thead><tbody id="log"></tbody></table>
  </section>

  <section id="feedback">
    <div class="sum"><div><b id="nBad">0</b>有問題</div><div><b id="nOk">0</b>正常</div><div><b id="nTodo">0</b>還沒看</div></div>
    <div class="row" style="margin-bottom:10px">
      <button class="primary" id="save">💾 儲存反饋（同時複製到剪貼簿）</button>
      <button id="reveal">在訪達中顯示</button>
      <button id="clearMarks">清空所有標記</button>
      <span class="hint" style="margin:0" id="savedTo"></span>
    </div>
    <p class="hint">儲存後告訴 Claude「反饋存好了」，它會直接讀這個檔案。</p>
    <textarea id="report" readonly></textarea>
  </section>
</main>

<script src="peak-hours.js"></script>
<script>
const $ = id => document.getElementById(id)
// macOS：WKWebView 的 webkit.messageHandlers；Windows：WebView2 的 chrome.webview
const post = msg => window.chrome?.webview ? window.chrome.webview.postMessage(msg) : window.webkit?.messageHandlers?.dev?.postMessage(msg)
const pet = code => post({ cmd: 'pet', code })
const wait = ms => new Promise(r => setTimeout(r, ms))
const J = v => JSON.stringify(v)
let manifest = { characters: {} }, appInfo = {}, sel = null, status = null, fallback = {}
let statusWaiters = []

// ---- 各姿態什麼時候出現（和 docs/自定义角色.md 一致）----
const BUILTIN = ['idle', 'listening', 'thinking', 'reading', 'writing', 'running', 'searching', 'delegating', 'drawing',
  'happy', 'proud', 'oops', 'surprised', 'pat', 'sleeping', 'tired', 'hum', 'stretch', 'yawn', 'compact', 'asking', 'update']
const EGG_POSES = ['pop', 'pretend', 'caught', 'bye', 'escape']
const WHEN = {
  idle: '平時', listening: '收到你的訊息', thinking: '思考', reading: '讀檔案、搜程式碼', writing: '寫檔案、改程式碼', running: '跑命令',
  searching: '上網查資料', delegating: '派子任務', drawing: '畫圖', happy: '一輪完成', proud: '一輪用了 8 次以上工具的大活完成',
  oops: '出錯', surprised: '被打斷 / 被戳', pat: '被摸頭', sleeping: '10 分鐘沒動靜', tired: '額度快用完', hum: '閒著時哼歌',
  stretch: '閒著時伸懶腰', yawn: '閒著時打哈欠', compact: '壓縮上下文', asking: 'AI 問你問題 / 等你授權', update: '有新版本', reset: 'Codex 額度提前重置',
  reset_check: '重置提醒：被問「會重置嗎？」時先查一下', reset_bell: '重置提醒：官方已宣佈要重置', reset_hope: '重置提醒：預測 ≥70%',
  reset_maybe: '重置提醒：預測 30–69%', reset_nope: '重置提醒：預測更低 / 沒風聲 / 連不上', feast: '餘額增加（充值）',
  sorry: '出錯 / 被打斷後你又發訊息', pop: '彩蛋：跳出來', pretend: '彩蛋：裝模作樣（等你點她）', caught: '彩蛋：被識破', bye: '彩蛋：溜走',
  escape: '彩蛋：沒人點、自己走掉（可選，沒畫用 bye）',
  greet_morning: '早上（5–11 點）第一次見面', greet_noon: '中午（11–14 點）第一次見面', greet_afternoon: '下午（14–18 點）第一次見面',
  greet_evening: '晚上（18–23 點）第一次見面', greet_night: '深夜（23–2 點）第一次見面', greet_dawn: '凌晨（2–5 點）第一次見面',
  fest_halloween: '萬聖節（10-31）第一次見面', fest_christmas: '聖誕（12-24、12-25）第一次見面', fest_newyear: '元旦（1-1）第一次見面',
  fest_spring: '春節（初一到初七）每天第一次見面', fest_lantern: '元宵（正月十五）第一次見面', fest_dragonboat: '端午（五月初五）第一次見面',
  fest_midautumn: '中秋（八月十五）第一次見面', fest_national: '國慶（10-1 到 10-7）每天第一次見面',
}

function posesOf(id) {
  const c = manifest.characters[id]
  if (c.egg) return EGG_POSES
  const list = [...BUILTIN]
  const add = p => { if (p && !list.includes(p)) list.push(p) }
  ;(c.idleActions || []).forEach(add)
  add(c.pokePose); add(c.longThink?.pose); add(c.correctedPose)
  if ((c.fx || {}).reset || c.poses.reset) add('reset')
  if ((c.fx || {}).feast || c.poses.feast) add('feast')
  Object.keys(c.poses).forEach(add)
  return list
}
function whenOf(id, p) {
  const c = manifest.characters[id]
  if ((c.idleActions || []).includes(p)) return '閒著時的專屬小動作'
  if (c.pokePose === p) return '被戳時'
  if (c.longThink?.pose === p) return `思考超過 ${c.longThink.after || 20} 秒`
  if (c.correctedPose === p) return WHEN.sorry
  return WHEN[p] || '專屬姿態'
}
const fileOf = u => decodeURIComponent(u.split('/').pop())
// 臺詞按姿態名找；多會話的左右兩幀共用一組臺詞（busy_left / busy_right → busy，swamped_* → swamped）
const lineKey = p => p.replace(/^(busy|swamped)_(left|right)$/, '$1')
const lineOf = (c, p) => ((c.lines || {})[lineKey(p)] || [])[0] || ''

// ---- 標記（存在本機）----
let marks = {}
try { marks = JSON.parse(localStorage.getItem('crosspet-dev-marks')) || {} } catch {}
const saveMarks = () => { try { localStorage.setItem('crosspet-dev-marks', J(marks)) } catch {}; renderReport() }
function markUI(key, el) {
  const m = marks[key] || {}
  const box = document.createElement('div')
  box.innerHTML = `<div class="marks"><button class="ok">✓ 正常</button><button class="bad">✗ 有問題</button></div>
    <input type="text" class="note" placeholder="哪裡不對？（比如：特效壓到頭髮 / 臺詞不合適）">`
  const [ok, bad] = box.querySelectorAll('button'), note = box.querySelector('input')
  const paint = () => {
    const v = marks[key]?.ok
    ok.classList.toggle('on', v === true); bad.classList.toggle('on', v === false)
    el.classList.toggle('mark-ok', v === true); el.classList.toggle('mark-bad', v === false)
    note.value = marks[key]?.note || ''
  }
  ok.onclick = () => { marks[key] = { ...marks[key], ok: marks[key]?.ok === true ? undefined : true }; saveMarks(); paint() }
  bad.onclick = () => { marks[key] = { ...marks[key], ok: marks[key]?.ok === false ? undefined : false }; saveMarks(); paint(); if (marks[key].ok === false) note.focus() }
  note.oninput = () => { marks[key] = { ...marks[key], note: note.value }; saveMarks() }
  paint()
  return box
}

// ---- 角色列表 ----
function renderChars() {
  const ids = Object.keys(manifest.characters)
  for (const [boxId, eggs] of [['chars', false], ['eggs', true]]) {
    const box = $(boxId); box.innerHTML = ''
    for (const id of ids.filter(i => !!manifest.characters[i].egg === eggs)) {
      const c = manifest.characters[id]
      const items = posesOf(id), keys = items.flatMap(p => (c.poses[p] || [null]).map((_, i) => `pose:${id}:${p}:${i}`))
      const bad = keys.filter(k => marks[k]?.ok === false).length, done = keys.filter(k => marks[k]?.ok !== undefined).length
      const d = document.createElement('div')
      d.className = 'char' + (id === sel ? ' sel' : '')
      d.innerHTML = `<img src="${(c.poses.idle || c.poses.pop || [''])[0]}"><div><div class="n">${c.name}</div><div class="c">${done}/${keys.length} 已看${bad ? ` · <span style="color:var(--bad)">${bad} 個問題</span>` : ''}</div></div>`
      d.onclick = () => { sel = id; renderChars(); renderGrid(); renderScenes() }
      box.append(d)
    }
  }
}

// ---- 姿態 ----
let tiles = [], playingIdx = -1
function renderGrid() {
  const c = manifest.characters[sel], grid = $('grid')
  grid.innerHTML = ''; tiles = []
  for (const p of posesOf(sel)) {
    const frames = c.poses[p]
    const list = frames ? frames.map((u, i) => ({ p, url: u, i })) : [{ p, url: null, i: 0 }]
    for (const f of list) {
      const key = `pose:${sel}:${p}:${f.i}`
      const t = document.createElement('div'); t.className = 'tile'
      const fbPose = fallback[p] && c.poses[fallback[p]] ? fallback[p] : null
      const fx = (c.fx || {})[p]
      const tag = !f.url ? `<span class="pill ${fbPose ? 'fb' : 'bad'}">${fbPose ? '缺圖，用 ' + fbPose + ' 頂上' : '缺圖'}</span>`
        : list.length > 1 ? `<span class="pill">${f.i + 1}/${list.length}</span>` : ''
      t.innerHTML = `<div class="thumb">${f.url ? `<img src="${f.url}" loading="lazy">` : `<div class="missing">還沒有立繪<br>${fbPose ? '現在會用 ' + fbPose : (c.idleActions || []).includes(p) ? '畫好之前不會出現' : '現在會用 idle'}</div>`}</div>
        <div class="tname"><code>${f.url ? fileOf(f.url) : p}</code>${tag}</div>
        <div class="when">${whenOf(sel, p)}${fx ? ` · 特效 <span class="pill">${fx}</span>` : ''}</div>
        <div class="line">${lineOf(c, p) ? '「' + lineOf(c, p) + '」' : '<span style="color:var(--muted)">（沒有臺詞）</span>'}</div>`
      const idx = tiles.length
      t.querySelector('.thumb').onclick = () => play(idx)
      t.append(markUI(key, t))
      grid.append(t)
      tiles.push({ el: t, p, url: f.url })
    }
  }
}
function play(idx) {
  if (idx < 0 || idx >= tiles.length) return
  tiles[playingIdx]?.el.classList.remove('playing')
  playingIdx = idx
  const t = tiles[idx], c = manifest.characters[sel]
  t.el.classList.add('playing'); t.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
  pet(`devShow(${J(sel)}, ${J(t.p)}, ${J(lineOf(c, t.p))}, ${J(t.url)})`)
}
let touring = null
$('tour').onclick = async () => {
  if (touring) { touring.stop = true; return }
  touring = { stop: false }; $('tour').textContent = '■ 停止輪播'
  for (let i = 0; i < tiles.length && !touring.stop; i++) { play(i); await wait(3500) }
  touring = null; $('tour').textContent = '▶ 逐個輪播這個角色的全部姿態'
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || !$('poses').classList.contains('sel')) return
  if (e.key === 'ArrowRight') { play(Math.min(tiles.length - 1, playingIdx + 1)); e.preventDefault() }
  if (e.key === 'ArrowLeft') { play(Math.max(0, playingIdx - 1)); e.preventDefault() }
})

// ---- 場景 ----
let tsSeq = 0
const nextTs = () => Date.now() / 1000 + (tsSeq++) * 0.001
const st = (id, pose, event, tool = '', extra = {}) => pet(`applyCharState(${J(id)}, ${J({ pose, event, tool, ts: nextTs(), ...extra })})`)
function petStatus() { return new Promise(r => { statusWaiters.push(r); post({ cmd: 'status' }) }) }
async function begin(id) {
  pet(`devRelease(); devActive = true; setCharacter(${J(id)}, true)`)
  await wait(700)
}
async function tools(id, list, gap = 2600) {
  for (const [pose, tool] of list) { st(id, pose, 'PreToolUse', tool); await wait(gap); st(id, 'thinking', 'PostToolUse', tool); await wait(1800) }
}
const SCENES = [
  { id: 'work', name: '一輪普通的工作', exp: '在聽 → 思考 → 讀讀看 → 寫寫寫 → 跑命令 → 查資料（中間會夾著思考；每個動作至少停 2.5 秒，太快的會合並）→ <b>開心</b>（打勾清單 + 彩紙）→ 約 5 秒後回到平時',
    run: async (id, prog) => { st(id, 'listening', 'UserPromptSubmit'); await wait(2500)
      prog('讀 → 寫 → 跑 → 查'); await tools(id, [['reading', 'Read'], ['writing', 'Edit'], ['running', 'Bash'], ['searching', 'WebSearch']])
      prog('完成'); st(id, 'happy', 'Stop') } },
  { id: 'bigjob', name: '大活完成（戴皇冠）', exp: '連續 9 次工具後結束 → <b>proud</b>：頭上戴著自己的皇冠，左上獎盃 + 閃光，約 6 秒',
    run: async (id, prog) => { st(id, 'listening', 'UserPromptSubmit'); await wait(1500)
      for (let i = 1; i <= 9; i++) { prog(`工具 ${i}/9`); st(id, ['reading', 'writing', 'running'][i % 3], 'PreToolUse', 'Tool'); await wait(900); st(id, 'thinking', 'PostToolUse'); await wait(500) }
      prog('完成'); st(id, 'proud', 'Stop') } },
  { id: 'draw', name: '畫圖', exp: '生圖工具 → <b>畫畫</b>（右上畫板，彩色筆觸一筆筆畫出來）→ 思考 → 開心',
    run: async (id) => { st(id, 'listening', 'UserPromptSubmit'); await wait(1500); await tools(id, [['drawing', 'image_gen']], 4500); st(id, 'happy', 'Stop') } },
  { id: 'delegate', name: '派子任務', exp: '<b>交給分身</b>（任務清單 + 紙飛機）→ 子任務結束回到思考 → 開心',
    run: async (id) => { st(id, 'delegating', 'SubagentStart'); await wait(4500); st(id, 'thinking', 'SubagentStop'); await wait(2500); st(id, 'happy', 'Stop') } },
  { id: 'oops', name: '出錯，然後被你糾正', exp: '跑命令 → <b>出錯</b>（錯誤卡片）→ 3 秒後你發訊息 → 有 correctedPose 的角色先<b>認錯</b>（Claude：「You\'re absolutely right!」），其他角色是普通的「在聽」→ 思考',

    run: async (id, prog) => { st(id, 'reading', 'PreToolUse', 'Read'); await wait(2600); st(id, 'asking', 'PreToolUse', 'AskUserQuestion')

  { id: 'abort', name: '被打斷', exp: '幹活中途被你按停 → <b>surprised</b>（「欸？！」）約 3 秒',

  { id: 'compact', name: '壓縮上下文', exp: '<b>compact</b>：往小箱子裡硬塞東西（身體有擠壓的動作）→ 壓縮完回到思考 → 開心',
    run: async (id, prog) => { st(id, 'compact', 'PreCompact'); prog('壓縮中（6 秒）'); await wait(6000); st(id, 'thinking', 'PostCompact'); await wait(2500); st(id, 'happy', 'Stop'); prog('') } },
  { id: 'piggy', name: '快速連發（Antigravity 那種）', exp: '工具結束後幾毫秒就開始思考：桌寵只收到「思考 + 捎帶的動作」，也應該先演<b>讀讀看 → 畫畫 → 寫寫寫</b>，每個約 2.5 秒，再思考',

  { id: 'longthink', name: '想了很久', only: c => c.longThink, exp: '思考超過設定的秒數 → 換成專屬的<b>深度思考</b>（DeepSeek：揉太陽穴 + 深海泡泡）。要等 20 多秒',
    run: async (id, prog) => { const c = manifest.characters[id]; st(id, 'listening', 'UserPromptSubmit'); await wait(1500); st(id, 'thinking', 'PostToolUse')

  { id: 'update', name: '有新版本', exp: '發現新版本 → <b>收到禮物</b>（NEW 小窗 + 往上跳的箭頭 + 進度條）約 6.5 秒，氣泡「有新版本…右鍵選單裡點更新」一直留著',
    run: async (id, prog) => { pet(`notifyUpdate('v9.9.9')`); prog('6.5 秒後回到常態'); await wait(7000); prog('') } },

      pet(`setQuota(${J(id)}, ${J(saved)})`); prog('') } },
  { id: 'reset', name: 'Codex 額度提前 reset', only: (c, id) => id === 'gpt', exp: '額度在預定重置前突然恢復 → <b>reset</b>：舉著重置卡難得地笑出來 + 彩紙，約 6.5 秒；之後恢復真實額度',
    run: async (id) => { const s = await petStatus(), saved = s.quota[id] ?? null, now = Date.now() / 1000
      const q = u => ({ text: `測試 本週 剩餘 ${100 - u}%`, low: false, windows: [{ label: '本週', used: u, reset: now + 400000 }] })
      pet(`setQuota('gpt', ${J(q(70))})`); await wait(500); pet(`setQuota('gpt', ${J(q(3))})`); await wait(8000); pet(`setQuota('gpt', ${J(saved)})`) } },
  { id: 'resets', name: 'Codex 重置提醒（7 檔）', only: (c, id) => id === 'gpt', exp: '不聯網，用假資料依次問她「會重置嗎？」：先<b>查手機</b>，再按檔回答——<b>官方已宣佈</b>（搖鈴，額度下方多一行「🔔 官方已宣佈重置」）→ <b>剛重置過</b>（慶祝，額度下方「✨ 2 小時前剛重置過」）→ <b>85%</b>（期待）→ <b>50%</b>（半信半疑）→ <b>10%</b>（搖頭）→ <b>沒風聲</b>（搖頭，說上次是幾天前）→ <b>連不上</b>（搖頭）。每檔約 10 秒，演完恢復真實設定',
    run: async (id, prog) => {
      const iso = ms => new Date(Date.now() + ms).toISOString()
      const src = { type: 'x_post', author: 'thsottiaux', url: 'https://x.com' }
      const watch = chance => ({ level: chance >= 70 ? 'strong' : 'elevated', reset_chance_percent: chance, forecast_window: 'within 24h', observed_at: iso(-3600e3), expires_at: iso(86400e3), text: '', source: src })
      const data = (extra = {}) => ({ data: { latest_reset: null, scheduled_reset: null, active_watch: null, stats: { total: 61, last_reset_at: iso(-1.4 * 86400e3), days_since_last: 1.4, avg_interval_days: 6.5 }, ...extra }, meta: { api_version: 'v1' } })
      const tiers = [
        ['官方已宣佈', data({ scheduled_reset: { id: 'dev', status: 'scheduled', reset_type: 'regular', announced_at: iso(-600e3), scheduled_for: iso(20 * 3600e3), text: '', source: src } })],
        ['剛重置過', data({ latest_reset: { id: 'dev-r', reset_type: 'regular', announced_at: iso(-2 * 3600e3), text: '', source: src } })],
        ['85%', data({ active_watch: watch(85) })], ['50%', data({ active_watch: watch(50) })], ['10%', data({ active_watch: watch(10) })],
        ['沒風聲', data()], ['連不上', null],
      ]
      for (const [name, d] of tiers) { prog(name); pet(`devResetsPlay(${J(d)})`); await wait(10500) }
      pet('devResetsDone()'); prog('') } },
  { id: 'peak', name: '峰谷換裝', only: (c, id) => !!window.PeakHours?.RULES[id], exp: '把時間挪到下一個工作日 <b>8:59:50</b>：額度下的時間條豎線跳到 9 點前，10 秒後進入<b>高峰</b>——設定裡選了「高峰穿」的話冒一團煙換上、說一句；再挪到 <b>11:59:50</b>，進入<b>空閒</b>換「空閒穿」的那件。沒在設定裡選衣服就只看時間條。不改你的設定，演完換回原來的衣服',
    run: async (id, prog) => {
      const day = 86400e3, bj = 8 * 3600e3, mid = Math.floor((Date.now() + bj) / day) * day - bj
      let d = 1; while (![1, 2, 3, 4, 5].includes(new Date(mid + d * day + bj).getUTCDay())) d++
      const at = h => mid + d * day + h * 3600e3 - 10e3
      prog('高峰前 10 秒'); pet(`devPeakPlay(${at(9)})`); await wait(16000)
      prog('空閒前 10 秒'); pet(`devPeakPlay(${at(12)})`); await wait(16000)

    run: async (id) => { const s = await petStatus(), saved = s.quota[id] ?? null
      pet(`setQuota('deepseek', ${J({ text: '餘額 ¥6.00', low: false, balance: 6 })})`); await wait(500)
      pet(`setQuota('deepseek', ${J({ text: '餘額 ¥26.00', low: false, balance: 26 })})`); await wait(8000); pet(`setQuota('deepseek', ${J(saved)})`) } },
  { id: 'egg', name: '彩蛋', only: (c, id) => Object.values(manifest.characters).some(e => e.egg && e.host === id), exp: '「噗」一下變成 cos 她的 DeepSeek：跳出來 → 裝模作樣（一直等）→ <b>你單擊桌寵</b> → 被識破 → 溜走 → 變回原角色。不點的話 40 秒後她自己溜走',
    run: async (id, prog) => { pet('playEgg(true)'); prog('現在去單擊桌寵試試') } },
  { id: 'touch', name: '摸頭 / 戳一下', exp: '<b>摸頭</b>（愛心往上飄）→ 4 秒後<b>戳一下</b>（頭邊彈出「!」；DeepSeek 是生氣）',
    run: async (id) => { pet("handleClick('pat')"); await wait(4500); pet("handleClick('poke')") } },
  { id: 'sleep', name: '睡著，再叫醒', exp: '<b>睡著</b>（月亮 + Zz）→ 4 秒後摸她 → <b>打哈欠</b>「唔…你回來啦」→ 平時',
    run: async (id) => { pet("setPose('sleeping'); say(pick(linesOf('sleeping') || ['']))"); await wait(4500); pet("handleClick('pat')") } },
  { id: 'idleacts', name: '閒置小動作', exp: '依次演她閒著時會做的動作（專屬的 + 哼歌、伸懶腰、打哈欠），每個約 4.5 秒',
    run: async (id, prog) => { const c = manifest.characters[id]
      const acts = [...(c.idleActions || []).filter(a => c.poses[a]), 'hum', 'stretch', 'yawn']
      for (const a of acts) { prog(a); pet(`if (!TRANSIENT[${J(a)}]) TRANSIENT[${J(a)}] = 4000; show(${J(a)}, true)`); await wait(4500) } prog('') } },
  { id: 'blink', name: '眨眼', only: c => c.blink, exp: '平時姿態下眨 3 次眼：只有眼睛閉上，頭髮和身體<b>不能跳動</b>',
    run: async (id) => { const c = manifest.characters[id]
      pet(`devShow(${J(id)}, 'idle', '', ${J(c.blinkBase)}, 8000)`); await wait(1200)
      for (let i = 0; i < 3; i++) { pet("$('blink').classList.add('on'); setTimeout(() => $('blink').classList.remove('on'), 140)"); await wait(1200) } } },
  { id: 'switch', name: '切換角色', exp: '依次換成每個角色：「噗」的煙霧 + 淡入，不能閃、不能兩個角色疊在一起，最後回到選中的角色',
    run: async (id) => { for (const o of Object.keys(manifest.characters).filter(k => !manifest.characters[k].egg)) { pet(`setCharacter(${J(o)})`); await wait(2200) } pet(`setCharacter(${J(id)})`) } },
]
let running = null
function renderScenes() {
  const box = $('sceneList'); box.innerHTML = ''
  const c = manifest.characters[sel]
  if (c.egg) { box.innerHTML = '<p class="hint">彩蛋角色沒有單獨的場景，選她的本體角色，用「彩蛋」場景來測。</p>'; return }
  for (const sc of SCENES.filter(s => !s.only || s.only(c, sel))) {
    const key = `scene:${sel}:${sc.id}`
    const el = document.createElement('div'); el.className = 'scene'
    el.innerHTML = `<div><h4>${sc.name}</h4><div class="exp">預期：${sc.exp}</div></div><div class="side"><div class="row"><button class="primary go">▶ 執行</button><span class="prog"></span></div></div>`
    const prog = t => { el.querySelector('.prog').textContent = t }
    el.querySelector('.go').onclick = async () => {
      if (running) return
      running = sc.id; prog('執行中…')
      try { await begin(sel); await sc.run(sel, prog) } finally { running = null; if (el.querySelector('.prog').textContent === '執行中…') prog('') }
    }
    el.querySelector('.side').append(markUI(key, el))
    box.append(el)
  }
}

// ---- 即時事件 ----
function logEvent(id, kind, data, paused) {
  const tr = document.createElement('tr')
  const t = new Date(), pad = n => String(n).padStart(2, '0')
  tr.innerHTML = `<td>${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}</td><td>${manifest.characters[id]?.name || id}</td><td>${kind === 'state' ? '狀態' : '額度'}</td>
    <td><code>${kind === 'state' ? `<b>${data.pose}</b> · ${data.event || ''}${data.tool ? ' · ' + data.tool : ''}${data.after ? ' · 捎帶 ' + data.after : ''}` : (data?.text || J(data))}</code></td>
    <td>${paused ? '<span class="pill fb">已暫停</span>' : '<span class="pill ok">已交給桌寵</span>'}</td>`
  $('log').prepend(tr)
  while ($('log').children.length > 300) $('log').lastChild.remove()
}

// ---- 桌寵狀態 ----
function onPetStatus(s) {
  status = s; fallback = s.fallback || fallback
  statusWaiters.splice(0).forEach(r => r(s))
  const c = manifest.characters[s.charId]
  $('status').innerHTML = `當前 <b>${c?.name || s.charId || '—'}</b> · 姿態 <b>${s.pose || '—'}</b> · 圖 <code>${s.image || '—'}</code>`
    + (s.usesFallback ? ' <span class="pill fb">缺圖，正在用頂替圖</span>' : '')
    + (s.fx ? ` · 特效 <span class="pill">${s.fx}</span>` : '')
    + (s.egg ? ` · <span class="pill fb">彩蛋中${s.egg.waiting ? '，等你點她' : ''}</span>` : '')
    + (s.held ? ' · <span class="pill">保持中</span>' : '')
    + (s.bubble ? ` · 氣泡「${s.bubble}」` : '')
}
setInterval(() => post({ cmd: 'status' }), 700)

// ---- 反饋 ----
function allKeys() {
  const keys = []
  for (const [id, c] of Object.entries(manifest.characters)) {
    for (const p of posesOf(id)) (c.poses[p] || [null]).forEach((u, i) => keys.push({ key: `pose:${id}:${p}:${i}`, label: `${c.name} · ${u ? fileOf(u) : p + '（缺圖）'}` }))
    if (!c.egg) for (const sc of SCENES.filter(s => !s.only || s.only(c, id))) keys.push({ key: `scene:${id}:${sc.id}`, label: `${c.name} · 場景「${sc.name}」` })
  }
  return keys
}
function renderReport() {
  const keys = allKeys()
  const bad = keys.filter(k => marks[k.key]?.ok === false), ok = keys.filter(k => marks[k.key]?.ok === true)
  $('nBad').textContent = bad.length; $('nOk').textContent = ok.length; $('nTodo').textContent = keys.length - bad.length - ok.length
  $('badCount').textContent = bad.length
  const now = new Date()
  $('report').value = [
    `# CrossPet 開發者反饋`, ``, `- 版本：${appInfo.version || '?'}`, `- 時間：${now.toLocaleString('zh-CN')}`,
    `- 統計：有問題 ${bad.length} · 正常 ${ok.length} · 還沒看 ${keys.length - bad.length - ok.length}`, ``,
    `## 有問題`, ``, ...(bad.length ? bad.map(k => `- **${k.label}**（\`${k.key}\`）：${marks[k.key].note || '（沒寫原因）'}`) : ['（無）']), ``,
    `## 正常`, ``, ...(ok.length ? ok.map(k => `- ${k.label}${marks[k.key].note ? '：' + marks[k.key].note : ''}`) : ['（無）']), ``,
  ].join('\n')
  if (manifest && sel) renderChars()
}
$('save').onclick = () => post({ cmd: 'save', text: $('report').value })
$('reveal').onclick = () => post({ cmd: 'reveal' })
$('clearMarks').onclick = () => { if (confirm('清空所有 ✓ / ✗ 標記和備註？')) { marks = {}; saveMarks(); renderGrid(); renderScenes() } }
function onSaved(path) { $('savedTo').textContent = '已儲存到 ' + path + '，也複製到了剪貼簿' }

// ---- 頂部按鈕 / 標籤頁 ----
let paused = true
$('pause').onclick = () => { paused = !paused; post({ cmd: 'pause', on: paused }); $('pause').classList.toggle('on', paused); $('pause').textContent = paused ? '⏸ 暫停真實 AI 事件' : '▶ 真實 AI 事件照常' }
$('release').onclick = () => { tiles[playingIdx]?.el.classList.remove('playing'); playingIdx = -1; pet('devRelease()') }
$('reloadPet').onclick = () => post({ cmd: 'reload' })
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sel', x === b))
  document.querySelectorAll('section').forEach(s => s.classList.toggle('sel', s.id === b.dataset.tab))
})

// ---- 由 App 呼叫 ----
function setAppInfo(info) { appInfo = info; $('ver').textContent = 'v' + info.version }
function boot(m) {
  manifest = m
  const ids = Object.keys(m.characters)
  if (!sel || !m.characters[sel]) sel = ids.find(i => !m.characters[i].egg)
  post({ cmd: 'pause', on: paused })
  renderChars(); renderGrid(); renderScenes(); renderReport()
}
</script>
</body></html>
