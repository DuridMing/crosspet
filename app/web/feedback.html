<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反饋問題</title>
<style>
/* 和設定視窗同一套配色；跟著系統深淺色 */
:root { --bg: #f6f3ee; --panel: #fff; --ink: #3b2a22; --muted: #8a7a70; --line: #e7dfd5; --accent: #c8792f; --ok: #2f9e5b; --warn: #b07a00; --field: #fffdfa; --hover: #faf5ee; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1f1b18; --panel: #2a2522; --ink: #efe6dd; --muted: #a8998d; --line: #3d3631; --accent: #e09a52; --ok: #5cc184; --warn: #e3b341; --field: #241f1c; --hover: #332c28; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif; color: var(--ink); padding: 14px 16px 16px; }
h1 { font-size: 15px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.qq-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
button.qq-copy { font: inherit; display: inline-block; border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--ink); border-radius: 18px; padding: 5px 14px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
button.qq-copy b, button.qq-copy span { display: inline; }
button.qq-copy b { color: var(--accent); font-size: 1.12em; letter-spacing: .5px; margin: 0 1px; }
button.qq-copy span { color: var(--muted); font-size: .9em; }
button.qq-copy:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--panel)); }
button.qq-copy.copied { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); color: var(--ok); }
.note { color: var(--muted); font-size: 11px; line-height: 1.55; margin: 0 0 6px; padding: 6px 9px; border-left: 2px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.chip { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 16px; padding: 5px 12px; cursor: pointer; transition: background .12s, border-color .12s; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ask { font-size: 12px; font-weight: 600; margin: 0 0 5px; }
.ask em { font-style: normal; font-weight: 400; color: var(--warn); margin-left: 4px; font-size: 11px; }
.ask.optional em { color: var(--muted); }
input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
input[type=text]:focus { outline: none; border-color: var(--accent); }
.attach { display: flex; align-items: flex-start; gap: 7px; margin: 10px 0 0; color: var(--muted); font-size: 12px; }
.attach input { margin: 2px 0 0; accent-color: var(--accent); }
.attach a { color: var(--accent); cursor: pointer; text-decoration: none; white-space: nowrap; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); max-height: 150px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; }
.bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.bar .msg { flex: 1; font-size: 12px; color: var(--muted); }
.bar .msg.err { color: var(--warn); }
button.send { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 5px 18px; cursor: pointer; }
button.send:disabled { opacity: .45; cursor: default; }
.done { display: none; text-align: center; padding: 40px 0 20px; }
.done b { display: block; font-size: 16px; margin-bottom: 4px; }
.done span { color: var(--muted); font-size: 12px; }
body.sent .form { display: none; }
body.sent .done { display: block; }
.hidden { display: none !important; }
.q { font-size: 12px; font-weight: 600; margin: 12px 0 6px; }
.q .n { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10px; text-align: center; line-height: 16px; margin-right: 6px; }
.q em { font-style: normal; font-weight: 400; color: var(--warn); margin-left: 4px; font-size: 11px; }
.q.optional em { color: var(--muted); }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kind { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 9px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
.kind:hover { border-color: var(--accent); }
.kind.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.kind small { display: block; color: var(--muted); font-size: 11px; }
</style></head>
<body>
<div class="form">
  <h1>反饋問題</h1>
  <div class="note">每一條反饋我都會認真看 🙏 因為是業餘時間一個人維護，修復會跟著版本更新一起釋出，可能要等幾天；崩潰、打不開這類問題會優先處理。著急的話，也可以先讓你常用的 AI 程式設計助手（Claude Code、Codex 等）幫忙排查一下：讓它看看 CrossPet 的日誌和接入配置，常常能更快找到原因。</div>
  <div class="qq-row" id="qq">有問題也可以來群裡聊：</div>
  <div class="sub">點一點，我們就知道該查哪裡。</div>
  <div class="q"><span class="n">1</span>遇到了什麼？</div>
  <div class="kinds" id="kinds"></div>
  <div id="followBox" class="hidden"><div class="q"><span class="n" id="followN">2</span><span id="followQ"></span></div><div class="chips" id="follow"></div></div>
  <div id="stillBox" class="hidden"><div class="q"><span class="n" id="stillN">3</span>問題現在還在嗎？</div><div class="chips" id="still"></div></div>
  <div id="textBox" class="hidden"><div class="q" id="ask"><span class="n" id="textN">4</span>一句話說說<em>必填</em></div>
    <input type="text" id="text" maxlength="200"></div>
  <label class="attach"><input type="checkbox" id="attach" checked>
    <span>附上排查這類問題要用的資訊（只有開關、時間和記錄，不含對話和金鑰；路徑裡的使用者名稱會被隱去）
      <a id="peek">看看會發什麼</a></span></label>
  <pre id="preview" class="hidden"></pre>
  <div class="bar"><span class="msg" id="msg"></span><button class="send" id="send" disabled>傳送</button></div>
</div>
<div class="done"><b>收到啦，謝謝！</b><span>每一條我都會看。視窗可以關掉了。</span></div>

<script src="feedback-plan.js"></script>
<script src="qq-group.js"></script>
<script>
document.getElementById('qq').append(QQGroup.button())
// 和宿主（macOS 的 WKWebView / Windows 的 WebView2）通訊：
//   頁面 → 外殼：{cmd:'get'}（開啟時）；{cmd:'collect', kind, target, want, key}（選好型別和補選時，want 是要收集的段落 id）；{cmd:'send', body}
//   外殼 → 頁面：setFacts(facts)（形狀見 feedback-plan.js；收集的結果帶回 collect 時的 key）；onSent(ok, message)
//   key 防串：換了型別後，上一類遲到的結果不能當成這一類的發出去
// 選哪些段、怎麼排、超長怎麼縮都在 feedback-plan.js（設計見 docs/superpowers/specs/2026-10-21-feedback-redesign-design.md）
const post = msg => window.chrome?.webview ? window.chrome.webview.postMessage(msg) : window.webkit?.messageHandlers?.feedback?.postMessage(msg)
const $ = id => document.getElementById(id)
const P = window.FeedbackPlan
let facts = { header: {}, integrations: [], characters: [], quotas: [], sections: {} }
let kind = null, target = null, still = null, collectedFor = null, receivedFor = null, sending = false, pendingSend = null

const kindOf = () => P.KINDS.find(k => k.id === kind)
const key = () => `${kind}|${target || ''}`
function chips(el, options, selected, pick) {
  el.replaceChildren(...options.map(o => {
    const b = document.createElement('button'); b.className = 'chip' + (o.id === selected ? ' on' : ''); b.textContent = o.label
    b.onclick = () => pick(o.id); return b
  }))
}
function renderKinds() {
  $('kinds').replaceChildren(...P.KINDS.map(k => {
    const b = document.createElement('button'); b.className = 'kind' + (k.id === kind ? ' on' : '')
    b.append(k.label); if (k.sub) { const s = document.createElement('small'); s.textContent = k.sub; b.append(s) }
    b.onclick = () => { if (kind !== k.id) { kind = k.id; target = null; still = null; refresh() } }
    return b
  }))
}
const FOLLOW_Q = { ai: '是哪個 AI 在幹活？', character: '是哪個角色？', quota: '哪一家的額度？' }
function refresh() {
  renderKinds()
  const k = kindOf(), opts = k ? P.followOptions(kind, facts) : []
  const needFollow = !!(k && k.follow), needStill = !!(k && k.askStill)
  $('followBox').classList.toggle('hidden', !needFollow)
  if (needFollow) { $('followQ').textContent = FOLLOW_Q[k.follow]; chips($('follow'), opts, target, id => { target = id; refresh() }) }
  $('stillBox').classList.toggle('hidden', !needStill)
  if (needStill) chips($('still'), P.STILL, still, id => { still = id; refresh() })
  $('textBox').classList.toggle('hidden', !k)
  let n = 2
  if (needFollow) $('followN').textContent = n++
  if (needStill) $('stillN').textContent = n++
  $('textN').textContent = n
  const optional = kind === 'idea'
  $('ask').classList.toggle('optional', optional)
  $('ask').querySelector('em').textContent = optional ? '可以不填' : '必填'
  if (k) $('text').placeholder = k.hint
  const chosen = k && (!needFollow || target) && (!needStill || still)
  const textOk = optional || $('text').value.trim().length >= 2
  $('send').disabled = sending || !(chosen && textOk)
  if (k && (!needFollow || target) && collectedFor !== key()) collect()
  if (!$('preview').classList.contains('hidden')) renderPreview()
}
function collect() {
  if (!kindOf()) return
  collectedFor = key(); receivedFor = null
  facts.sections = {}   // 上一類的段落作廢
  post({ cmd: 'collect', kind, target: target || '', want: P.sectionsFor(kind, target || '', facts), key: collectedFor })
}
function card(partial) {
  return P.buildCard({ kind, target: target || '', still, text: $('text').value.trim(), attach: $('attach').checked, facts, partial })
}
// 預覽：把卡片攤成純文本，和真正發出去的一樣
function renderPreview() {
  if (!kindOf()) { $('preview').textContent = '先在上面選一個'; return }
  const c = card().card
  const lines = [c.header.title.content, '']
  for (const e of c.elements) {
    if (e.tag === 'div' && e.text) lines.push(e.text.content)
    else if (e.tag === 'div' && e.fields) lines.push(e.fields.map(f => f.text.content).join('　'))
    else if (e.tag === 'note') lines.push('', ...e.elements.map(x => x.content))
  }
  $('preview').textContent = lines.join('\n')
}
function setFacts(f) {
  // 只更新開頭 / 選項的那次（不帶 key）不動已經收到的段落；收集的結果只認當前這一類的
  const mine = f.key != null && f.key === key()
  facts = { ...facts, ...f, sections: mine ? { ...(f.sections || {}) } : facts.sections }
  if (mine) receivedFor = f.key
  refresh()
  if (pendingSend && mine) { clearTimeout(pendingSend); pendingSend = null; doSend() }
}
function doSend(partial) { post({ cmd: 'send', body: JSON.stringify(card(partial)) }) }
function onSent(ok, message) {
  sending = false
  if (ok) { document.body.classList.add('sent'); return }
  $('msg').textContent = message || '沒發出去，稍後再試試'
  $('msg').classList.add('err')
  refresh()
}

$('text').oninput = () => { $('msg').classList.remove('err'); refresh() }
$('text').onkeydown = e => { if (e.key === 'Enter' && !$('send').disabled) $('send').click() }
$('attach').onchange = () => refresh()
// 連結在勾選框的 <label> 裡：不攔住預設動作的話，點它會順帶把「附上」的勾取消掉
$('peek').onclick = e => { e.preventDefault(); $('preview').classList.toggle('hidden'); refresh() }
$('send').onclick = () => {
  sending = true; refresh()
  $('msg').textContent = '正在傳送…'; $('msg').classList.remove('err')
  // 外殼還沒把這一類的資訊交回來：等它，最多 8 秒；到點就照發，卡片裡寫明沒收齊
  if ($('attach').checked && receivedFor !== key()) {
    if (collectedFor !== key()) collect()
    pendingSend = setTimeout(() => { pendingSend = null; doSend(true) }, 8000); return
  }
  doSend()
}

refresh()
post({ cmd: 'get' })
</script>
</body></html>
