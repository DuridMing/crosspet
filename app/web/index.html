<!doctype html>
<html><head><meta charset="utf-8">
<style>
@property --aura { syntax: '<color>'; inherits: true; initial-value: #ffd9b0; }
/* --k：文字區域（氣泡、名牌、額度）相對人物再放大多少，外殼調 setSizes 設；鎖著時 1 */
:root { --aura: #ffd9b0; --aura-o: .35; --k: 1; }
html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; cursor: default;
  font-family: -apple-system, "PingFang SC", sans-serif; }
/* 從下往上排：底欄（名牌 + 額度）固定高度貼著視窗底邊，人物在它上面，氣泡從人物頭頂往上長。
   這樣名牌開關、額度有幾行、臺詞有多長，人物都不挪位置，額度也不會被長臺詞擠出視窗
   （Windows 上微軟雅黑行高大，之前開著名牌、臺詞折兩三行時額度會被擠出去） */
#wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100vh; }
#wrap > * { flex-shrink: 0; }
/* 底欄最小高度按 max(1, k)：字比人小時不縮，人物不往下掉 */
#foot { min-height: calc(62px * max(1, var(--k))); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
#bubble { position: relative; z-index: 3; margin-bottom: calc(-10px * var(--k)); max-width: calc(228px * var(--k)); min-height: calc(18px * var(--k));
  margin-top: calc(4px * var(--k)); padding: calc(5px * var(--k)) calc(11px * var(--k)); border-radius: calc(12px * var(--k));
  background: rgba(255,255,255,.95); border: calc(1.5px * var(--k)) solid var(--accent, #e0b48a); color: #4a2418;
  font-size: calc(13px * var(--k)); line-height: 1.35; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: opacity .3s, transform .3s; }
#bubble.hide { opacity: 0; transform: translateY(4px); }
/* 更新後的「新功能」卡片：放在氣泡的位置（她頭頂，掛在 #stage 上沿、和氣泡一樣往下壓 10），不佔排版、不改視窗大小 */
#newsCard { position: absolute; z-index: 4; left: 50%; bottom: calc(100% - 10px * var(--k)); transform: translateX(-50%); width: max-content; max-width: calc(228px * var(--k));
  padding: calc(4px * var(--k)) calc(11px * var(--k)) calc(2px * var(--k)); border-radius: calc(12px * var(--k)); background: rgba(255,255,255,.97);
  border: calc(1.5px * var(--k)) solid var(--accent, #e0b48a); color: #4a2418; font-size: calc(13px * var(--k)); line-height: 1.3; text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.12); transition: opacity .3s; white-space: nowrap; }
#newsCard.hidden { opacity: 0; visibility: hidden; }
#newsCard .btns { display: flex; justify-content: center; gap: calc(10px * var(--k)); }
#newsCard button { font: inherit; font-size: calc(12px * var(--k)); border: none; background: none; color: #998; padding: 0 calc(6px * var(--k)); min-height: calc(22px * var(--k)); cursor: pointer; }
#newsCard button.go { color: #c8792f; font-weight: 600; }
#stage { position: relative; width: 250px; height: 241px; transition: transform .32s ease, opacity .32s ease; }
#stage.swap { transform: scale(.9) translateY(4%); opacity: 0; }
#aura { position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px;
  border-radius: 50%; opacity: var(--aura-o);
  background: radial-gradient(circle closest-side, var(--aura) 0%, color-mix(in srgb, var(--aura) 45%, transparent) 45%, transparent 100%);
  transition: --aura 0.8s, opacity .8s; animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
/* 背景光暈：淺色背景上是柔和的氛圍，深色背景上會變成一圈發亮的圓盤（像佛光）。
   html 上的 aura-on / aura-off 由宿主按右鍵選單的選擇設；都沒有（自動）時跟著系統深淺色，深色模式下不顯示 */
html.aura-off #aura, html.aura-off .aura-rings { display: none; }
@media (prefers-color-scheme: dark) { html:not(.aura-on) #aura, html:not(.aura-on) .aura-rings { display: none; } }
#shadow { position: absolute; left: 50%; bottom: 7px; width: 110px; height: 10px; margin-left: -55px;
  border-radius: 50%; background: rgba(0,0,0,.13); }
#body { position: absolute; left: 17.8%; top: 21.1%; width: 64.5%; height: 75%; transform-origin: 50% 100%; }
/* 立繪按高度佔滿人物框；比框寬的（張開翅膀、帶小幫手、抱大碗……）往左右多伸出去，最多到整個舞臺寬，
   而不是整體縮小——這樣所有姿態里人物一樣高 */
#body img { position: absolute; top: 0; bottom: 0; left: -27.5%; width: 155%; height: 100%; object-fit: contain; object-position: 50% 100%;
  opacity: 0; transition: opacity .35s ease; }
#body img.on { opacity: 1; }
#body img#blink { transition: none; }
#fx { position: absolute; inset: 0; transition: opacity .3s; pointer-events: none; }
/* 閒著久了：身邊的特效淡出（見「特效省電」） */
#fx.rest { opacity: 0; transition: opacity 1.2s; }
/* 看不見（被擋住、鎖屏）：所有動畫暫停 */
html.frozen *, html.frozen *::before, html.frozen *::after { animation-play-state: paused !important; }
/* 多會話：每個正在幹活的對話一張小卡片，放在桌寵兩側 / 四個角 */
#cards { position: absolute; inset: 0; pointer-events: none; }
.scard { position: absolute; width: 66px; height: 56px; transition: left .35s ease, top .35s ease, opacity .35s ease, transform .35s ease; opacity: 0; transform: scale(.6); }
.scard.on { opacity: .72; transform: scale(.92); }
.scard.on.focus { opacity: 1; transform: scale(1.06); }
.scard svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }
.scard .badge { position: absolute; right: -4px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; color: #fff; font: bold 13px/20px sans-serif; text-align: center; opacity: 0; transform: scale(.4); transition: opacity .25s, transform .25s; }
.scard.done .badge { background: #3dbb6a; opacity: 1; transform: none; }
.scard.error svg { filter: drop-shadow(0 0 3px #ff5a5a); }
.scard.error { animation: cardShake .45s ease 2; }
.scard.ask { animation: cardBounce .9s ease-in-out infinite; }
@keyframes cardShake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
@keyframes cardBounce { 50% { translate: 0 -5px; } }
#more { position: absolute; right: 2px; bottom: 6px; padding: 1px 7px; border-radius: 9px; background: rgba(255,255,255,.9); color: #4a2418;
  font: bold 11px/16px sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.15); opacity: 0; transition: opacity .3s; }
#more.on { opacity: 1; }
/* 貼邊：縮在螢幕邊上時只露半個身子（扒著邊緣的立繪，沒畫時用平常的），額度、名牌、氣泡、特效都藏起來 */
html.tucked #bubble, html.tucked #fx, html.tucked #cards, html.tucked #aura, html.tucked #shadow { visibility: hidden; }
/* 名牌、額度在最底下：直接拿出版面（只隱藏的話，透明視窗偶爾少擦它們底邊那一行，縮排去那一下閃一條橫線） */
html.tucked #caption, html.tucked #quota { display: none !important; }   /* important：額度條、合併顯示的 #quota.bars / .agg 寫了 display: grid，選擇器更具體，會蓋過這條 */
/* 有貼邊立繪時：立繪貼著視窗那條邊放，切口就是視窗的邊、也就是螢幕邊緣。貼邊 / 探出來兩張換圖時視窗不用動，原地淡入淡出 */
html.tucked-art.tucked-left #wrap { align-items: flex-start; }
html.tucked-art.tucked-right #wrap { align-items: flex-end; }
html.tucked-art #body { left: 0; width: 100%; }
html.tucked-art #body img { left: 0; width: 100%; }
html.tucked-art.tucked-left #body img { object-position: 0% 100%; }
html.tucked-art.tucked-right #body img { object-position: 100% 100%; }
html.tucked-art #body { animation: none !important; transform: none !important; }
#fx.hide { opacity: 0; }
#fx svg { width: 100%; height: 100%; overflow: visible; }
#poof { position: absolute; left: 50%; top: 55%; width: 0; height: 0; pointer-events: none; }
#poof i { position: absolute; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 2px rgba(74,36,24,.25); opacity: 0; }
#poof.go i { animation: puff .6s ease-out forwards; }
@keyframes puff { 0% { opacity: .95; transform: translate(0,0) scale(.3); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); } }
.m-dash  { animation: dash 2.2s ease-in-out forwards; }
.m-leave { animation: leave 1s ease-in forwards; }
@keyframes leave { 0% { transform: none; } 100% { transform: translateX(28%) rotate(4deg); opacity: 0; } }
@keyframes dash { 0%, 55% { transform: none; } 100% { transform: translateX(28%) rotate(4deg); opacity: 0; } }
#caption { margin-top: calc(-2px * var(--k)); padding: calc(2px * var(--k)) calc(9px * var(--k)); border-radius: calc(8px * var(--k)); background: rgba(255,255,255,.85);
  color: #6b4a3a; font-size: calc(11px * var(--k)); min-height: calc(14px * var(--k)); }
#caption:empty { visibility: hidden; }
html.no-name #caption { display: none; }
#quota { max-width: calc(236px * var(--k)); text-align: center; line-height: 1.35; margin-top: calc(2px * var(--k)); padding: calc(1px * var(--k)) calc(8px * var(--k));
  border-radius: calc(7px * var(--k)); background: rgba(255,255,255,.8); color: #6b4a3a; font-size: calc(10px * var(--k)); }
#quota:empty { display: none; }
#quota div { white-space: nowrap; }
#quota.low { color: #c0392b; background: rgba(255,236,236,.92); }
#quota .notice { color: #6b4a3a; font-weight: 600; }   /* 重置提醒那一行：不跟著額度緊張變紅 */
/* 額度條樣式（quota-bars.js）：每個額度一行——名字、條、剩餘百分比、重置時間；條按剩餘分三檔變色 */
#quota.bars:not(:empty) { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; text-align: left; min-width: calc(170px * var(--k)); }
#quota .qbar { display: contents; white-space: nowrap; }   /* 一行四格：名字、條、百分比、時間，各行對齊成表 */
#quota.bars > div:not(.qbar) { grid-column: 1 / -1; }   /* 文字行（餘額）、重置提醒、峰谷條、備註佔滿一行 */
#quota .ql { padding-right: calc(4px * var(--k)); white-space: nowrap; }
#quota .qtrack { min-width: calc(30px * var(--k)); height: calc(5px * var(--k)); border-radius: calc(3px * var(--k)); background: #e4dcd6; overflow: hidden; }
#quota .qtrack i { display: block; height: 100%; border-radius: inherit; background: var(--bar); }
#quota .qp { padding-left: calc(4px * var(--k)); font-weight: 700; color: var(--bar); text-align: right; white-space: nowrap; }
#quota .qt { padding-left: calc(4px * var(--k)); font-size: calc(8.5px * var(--k)); color: #a8958a; white-space: nowrap; }
#quota .qc.qbarcell { display: flex; align-items: center; gap: calc(3px * var(--k)); }   /* 合併顯示裡的短條格子 */
#quota .qc.qbarcell .ql { padding-right: 0; }
#quota .qc.qbarcell .qtrack { width: calc(34px * var(--k)); min-width: 0; flex: none; }
#quota.tight .qc.qbarcell .qtrack { width: calc(20px * var(--k)); }   /* 四家都開、併成三格時放不下：條短一點 */
#quota .qc.qbarcell .qp { padding-left: 0; }
#quota .ok { --bar: #4f7fd8; }
#quota .mid { --bar: #e0902f; }
#quota .low { --bar: #c0392b; }
#quota .qnote { font-size: calc(8.5px * var(--k)); color: #a8958a; }
/* 峰谷時段（設定裡選款式）。時間條：一天 24 小時，紅 = 高峰、綠 = 空閒，豎線 = 現在（北京時間）；顏色要夠深，淺色桌面上也看得清 */
#quota .peak { padding: calc(2px * var(--k)) 0 0; }
#quota .peakbar { position: relative; width: calc(150px * var(--k)); height: calc(6px * var(--k)); margin: 0 auto; border-radius: calc(3px * var(--k)); overflow: hidden; background: #7cc493; box-shadow: inset 0 0 0 calc(.5px * var(--k)) rgba(74,36,24,.35); }
#quota .peakbar i { position: absolute; top: 0; bottom: 0; }
#quota .peakbar i.peak-on { background: #ec8174; }
#quota .peakbar i.valley-on { background: #7cc493; }
#quota .peaknow { position: absolute; top: calc(-1px * var(--k)); width: calc(150px * var(--k)); left: 50%; margin-left: calc(-75px * var(--k)); height: calc(8px * var(--k)); pointer-events: none; }
#quota .peaknow b { position: absolute; top: 0; bottom: 0; width: calc(2px * var(--k)); margin-left: calc(-1px * var(--k)); background: #3a2219; border-radius: 1px; box-shadow: 0 0 0 calc(1px * var(--k)) #fff; }
#quota .peakwrap { position: relative; }
#quota .peakticks { position: relative; width: calc(150px * var(--k)); height: calc(11px * var(--k)); margin: 0 auto; font-size: calc(8px * var(--k)); color: #6b4a3a; }
#quota .peakticks span { position: absolute; top: 0; transform: translateX(-50%); }
#quota .peakticks span:first-child { transform: none; }
#quota .peakticks span:last-child { transform: translateX(-100%); }
/* 文字款：一行「● 高峰」或「● 空閒」 */
#quota .peaktext { font-weight: 600; }
#quota .peaktext.peak-on { color: #dc5f51; }
#quota .peaktext.valley-on { color: #4aa265; }
#quota .peaktext::before { content: ''; display: inline-block; width: calc(7px * var(--k)); height: calc(7px * var(--k)); margin-right: calc(4px * var(--k)); border-radius: 50%; background: currentColor; vertical-align: calc(.5px * var(--k)); }
/* 額度合併顯示：一家 AI 一行，名字一列、每個額度視窗一列（quota-aggregate.js），只有緊張的百分比變紅 */
#quota.agg:not(:empty) { display: grid; justify-content: center; text-align: left; font-variant-numeric: tabular-nums; }
#quota .qn { white-space: nowrap; padding-right: calc(7px * var(--k)); font-weight: 600; }
#quota .qc { white-space: nowrap; padding: 0 calc(6px * var(--k)); }
#quota .qn + .qc { padding-left: 0; }
#quota .qc + .qc { border-left: 1px solid rgba(107,74,58,.25); }
#quota .qc .low { color: #c0392b; font-weight: 700; }
/* 四家都有時 4 行要塞進底欄（#foot 的 62px 預算裡額度小窗最多約 43px），人物才不會被頂上去；字放大時預算也按 k 放大 */
#quota.tight { font-size: calc(9px * var(--k)); line-height: 1.1; }
#quota.tight .qc { padding: 0 calc(4px * var(--k)); }
#quota.tight .qn { padding-right: calc(5px * var(--k)); }

/* 身體動作：切換時用 animation 平滑接上 */
.m-bob   { animation: bob 3.2s ease-in-out infinite; }
.m-hop   { animation: bob-big .8s ease-in-out infinite; }
.m-jump  { animation: jump .7s ease-in-out infinite; }
.m-quick { animation: bob-small .45s ease-in-out infinite; }
.m-rock  { animation: rock 3s ease-in-out infinite; }
.m-sway  { animation: rock 1.8s ease-in-out infinite; }
.m-slow  { animation: bob-tiny 4.5s ease-in-out infinite; }
.m-float { animation: float 4.2s ease-in-out infinite; }
.m-shake { animation: shake 1.4s ease-in-out infinite; }
/* 紅溫：渾身發抖、泛紅光；被甩暈：東倒西歪 */
.m-angry { animation: angry .14s linear infinite; }
.m-angry img { filter: drop-shadow(0 0 7px rgba(255, 60, 30, .75)) saturate(1.15); }
.m-dizzy { animation: dizzy 1.1s ease-in-out infinite; }
/* 多會話時被甩：小卡片東倒西歪 */
#cards.shaken .scard { animation: card-wobble .22s ease-in-out 4 alternate; }
#cards.shaken .scard:nth-child(even) { animation-direction: alternate-reverse; }
@keyframes card-wobble { from { transform: scale(.92) translate(-5px, 2px) rotate(-16deg); } to { transform: scale(.92) translate(5px, -3px) rotate(16deg); } }
@keyframes angry { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-1.2%, .4%); } 50% { transform: translate(1.2%, -.4%); } 75% { transform: translate(-.8%, -.3%); } }
@keyframes dizzy { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.m-squish{ animation: squish 1.6s ease-in-out infinite; }
.m-gift  { animation: gift .65s cubic-bezier(.3,1.6,.5,1) 1, bob-big 1.1s ease-in-out .65s infinite; }
.m-jolt  { animation: jolt .55s cubic-bezier(.3,1.6,.5,1) 1, bob 3.2s ease-in-out .55s infinite; }
@keyframes bob { 50% { transform: translateY(-2.5%); } }
@keyframes bob-big { 50% { transform: translateY(-5%); } }
@keyframes bob-small { 50% { transform: translateY(-1.8%); } }
@keyframes float { 0%,100% { transform: translateY(-4%) rotate(-1.5deg); } 50% { transform: translateY(-10%) rotate(1.5deg); } }
@keyframes bob-tiny { 50% { transform: translateY(-.8%) scale(1.01, 1.015); } }
@keyframes jump { 0%,100% { transform: translateY(0) scale(1.02,.98); } 50% { transform: translateY(-9%) scale(.98,1.02); } }
@keyframes rock { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes shake { 0%,50%,100% { transform: translateX(0); } 10% { transform: translateX(-3%); } 20% { transform: translateX(3%); }
  30% { transform: translateX(-2%); } 40% { transform: translateX(2%); } }
@keyframes squish { 50% { transform: scale(.96, 1.05); } }
@keyframes gift { 0% { transform: translateY(3%) scale(1.05,.93); } 45% { transform: translateY(-9%) scale(.97,1.04); } 100% { transform: none; } }
@keyframes jolt { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-3%, -4%) rotate(-4deg) scale(.97,1.04); } 60% { transform: translate(1%, 0) rotate(1.5deg); } 100% { transform: none; } }
/* 從別的視窗後面浮到最上層（顯示層級「跟著 AI」）：先藏起來，換完層級再淡入、輕輕上浮，不要一下子蓋上來 */
#wrap.sunk { opacity: 0; }
#wrap.surface { animation: surface .45s cubic-bezier(.2,.8,.2,1); }
@keyframes surface { from { opacity: 0; transform: translateY(5%) scale(.97); } to { opacity: 1; transform: none; } }
</style></head>
<body>
<div id="wrap">
  <div id="bubble" class="hide"></div>
  <div id="stage">
    <div id="aura"></div><div id="shadow"></div>
    <div id="body"><img id="a" class="on"><img id="b"><img id="blink"></div>
    <div id="fx"></div>
    <div id="cards"><div id="more"></div></div>
    <div id="newsCard" class="hidden"><div id="newsText"></div><div class="btns"><button class="go" data-action="news-open">去看看 ›</button><button data-action="news-close">知道了</button></div></div>
    <div id="poof"><i style="--dx:-60px;--dy:-30px"></i><i style="--dx:55px;--dy:-35px"></i><i style="--dx:-45px;--dy:40px"></i><i style="--dx:50px;--dy:35px"></i><i style="--dx:0;--dy:-60px"></i></div>
  </div>
  <div id="foot"><div id="caption"></div><div id="quota"></div></div>
</div>
<script>
// 立繪載入失敗：告訴 Windows 外殼記進日誌（反饋裡能看出是哪張圖）。macOS 上沒有這個通道，不做任何事
// 同時記下最近 5 次失敗的檔名（只要檔名），反饋時 diagnoseDisplay 交出去
var imageErrors = []
addEventListener('error', e => {
  if (!(e.target && e.target.tagName === 'IMG' && e.target.src)) return
  window.chrome?.webview?.postMessage({ imageError: e.target.src })
  imageErrors.push({ file: decodeURIComponent(e.target.src.split(/[?#]/)[0].split('/').pop()), t: Math.round(Date.now() / 1000) })
  if (imageErrors.length > 5) imageErrors.shift()
}, true)
</script>

<script>
// CrossPet 畫面：由 CrossPet.app（Swift 外殼）呼叫這幾個函式
//   init(manifest)          角色清單（characters/*/character.json + 立繪）
//   setCharacter(id)        切換角色（按前臺應用自動切，或右鍵選單）
//   applyCharState(id, s)   某個 AI 的工作狀態（各接入寫的 <id>-state.json）

// 登場臺詞冷卻：同一個角色 30 分鐘內只打一次招呼，在幾個 AI 的 App 之間來回切時不用每次都聽「XX 來了」

function setCharacter(id, quiet) {

  if (id === charId && !characterTimer) return
  const generation = ++characterGeneration
  clearTimeout(characterTimer)
  // 上一個角色還沒跑完的定時動作（聽完轉思考、工具結束回思考、排隊等著換的動作、演完回待機）全部作廢：
  // 不然會落到換上來的角色身上——她明明閒著，卻突然開始思考 / 寫東西（PR #26 @KQYaili 報的「串臺」）

// ---- 按時段 / 節日打招呼 ----
// 每個角色在每個時段（早上、中午、下午、晚上、深夜、凌晨）第一次見面時演一次專屬動作；節日當天第一次見面換成節日裝扮。
// 打過招呼的記在本機（localStorage），重啟 App 不會重複。沒畫立繪的角色只說臺詞；連臺詞都沒有就用平常那句。
// 農曆節日的公曆日期（春節、元宵、端午、中秋），用 lunardate 算好寫死，2036 年之後需要補
const LUNAR = {
  2026: ['02-17', '03-03', '06-19', '09-25'], 2027: ['02-06', '02-20', '06-09', '09-15'], 2028: ['01-26', '02-09', '05-28', '10-03'],
  2029: ['02-13', '02-27', '06-16', '09-22'], 2030: ['02-03', '02-17', '06-05', '09-12'], 2031: ['01-23', '02-06', '06-24', '10-01'],
  2032: ['02-11', '02-25', '06-12', '09-19'], 2033: ['01-31', '02-14', '06-01', '09-08'], 2034: ['02-19', '03-05', '06-20', '09-27'],
  2035: ['02-08', '02-22', '06-10', '09-16'], 2036: ['01-28', '02-11', '05-30', '10-04'],
}
const pad2 = n => String(n).padStart(2, '0')
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`
function timeSlot(d) {
  const h = d.getHours()

}

  const y = d.getFullYear(), md = ymd(d).slice(5), [spring, lantern, dragonboat, midautumn] = LUNAR[y] || []
  // 單日的節日優先
  if (md === lantern) return 'lantern'
  if (md === dragonboat) return 'dragonboat'
  if (md === midautumn) return 'midautumn'
  if (md === '10-31') return 'halloween'
  if (md === '12-24' || md === '12-25') return 'christmas'
  if (md === '01-01') return 'newyear'
  if (spring) {
    const days = (d - new Date(`${y}-${spring}T00:00:00`)) / 86400000
    if (days >= 0 && days < 7) return 'spring'   // 初一到初七
  }
  if (md === '10-10') return 'national'   // maid fork：臺灣國慶日（雙十節）
  return null
}
function greetMemory(update) {
  let m = {}
  try { m = JSON.parse(localStorage.getItem('crosspet-greeted')) || {} } catch {}
  if (update) { update(m); try { localStorage.setItem('crosspet-greeted', JSON.stringify(m)) } catch {} }
  return m
}
// 返回 true = 打過招呼了（演了專屬動作或說了專屬臺詞）
function timeGreet(id, busy) {
  const c = manifest.characters[id]
  if (!c || c.egg) return false
  const now = new Date(), fest = festivalOf(now), slot = timeSlot(now)
  const day = ymd(new Date(now - 5 * 3600000))   // 凌晨 5 點前還算前一天：深夜 23–2 點是同一個時段
  const slotKey = `slot:${day}:${slot}`, festKey = `fest:${ymd(now)}:${fest}`
  const done = greetMemory()[id] || []
  const has = p => !!(c.poses?.[p] || c.lines?.[p])
  let p = null
  if (fest && !done.includes(festKey) && has('fest_' + fest)) p = 'fest_' + fest
  else if (!done.includes(slotKey) && has('greet_' + slot)) p = 'greet_' + slot
  if (!p) return false
  greetMemory(m => { m[id] = [...(m[id] || []).filter(k => k.includes(day) || k.includes(ymd(now))), slotKey, ...(fest ? [festKey] : [])] })
  greetedAt[id] = Date.now()
  const line = pick(c.lines?.[p] || [c.greeting || ''])
  if (!busy && c.poses?.[p]) { show(p, true); say(line) }   // 正在幹活時不打斷，只說一句
  else say(line)
  return true
}

  if ((pose !== 'idle' && pose !== 'tired') || Date.now() - lastActive > SLEEP_AFTER) return

// 外殼把她拖到螢幕左 / 右邊緣時調 setTucked('left' / 'right')，跑出來時 setTucked(null)。

// 沒畫貼邊立繪時用平常的立繪，切口在她身體正中，螢幕邊緣擋住一半

function repaintNow() {

    stage.style.transform = `translateX(${dx}px)`

let preloaded = null
function preloadEdges() {

// ---- 特效省電 ----
// 實測（M 系列 Mac）：身邊的 SVG 特效（星星、思考雲、小卡片）是耗電大頭，SVG 自己的時鐘跑時整個桌寵佔一個核的 16%～19%，
// 停掉特效只剩 1.5%；人物浮動、光暈是 CSS 變換，幾乎不花錢。所以只管特效：
// - 暫停 SVG 自己的時鐘，跟著螢幕重新整理按幀推進（#fx、多會話卡片都算）：平時 60 幀（幹活時約 11%），省電模式 30 幀（約 8%）。
//   15 幀時畫筆、終端裡的字明顯一頓一頓，使用者反饋過，所以省電模式也不再往下壓
// - 閒著（待機 / 累 / 睡著）超過 30 秒（省電模式 10 秒）：特效淡出並停下；睡著的 zZz 保留，每秒 5 幀

const RESTING = new Set(['idle', 'tired', 'sleeping'])
let powerSave = false, fxResting = false, pageHidden = false, fxClock = null, fxFps = 0, restTimer = null
function fxTick() {
  const now = performance.now()

      s.pauseAnimations(); s._fxT = s._fxLast ?? s.getCurrentTime(); s._fxS = now

}
function applyFxRate() {
  const fps = pageHidden ? 0 : fxResting ? (pose === 'sleeping' ? 5 : 0) : powerSave ? 30 : 60

  document.documentElement.classList.toggle('frozen', pageHidden)
  if (fps === fxFps && (fps === 0 || fxClock)) return
  // 停過表（藏起來、閒著歇了）再開：從停下時的那一幀接著走，不一下子跳過停著的那段
  if (fxFps <= 0 && fps > 0) { const now = performance.now(); for (const s of document.querySelectorAll('#fx svg, #cards svg')) if (s._fxLast !== undefined) { s._fxT = s._fxLast; s._fxS = now } }

  fxTick()   // 新出現的先接管（停住自己的時鐘）
  if (fps > 0) {
    // 跟著螢幕刷新出幀（隔幾幀出一幀），節拍均勻；單用定時器和螢幕重新整理對不齊，一幀停得長一幀停得短，移動的文字、畫筆看著一抖一抖

  if (t - fxLast >= 1000 / fxFps - 4) { fxLast = t; fxTick() }
  fxRaf = requestAnimationFrame(fxLoop)

// 新畫上去的特效馬上接管，別先按 60 幀跑一下
new MutationObserver(() => fxTick()).observe(document.getElementById('stage'), { childList: true, subtree: true })
function noteRest(p) {
  clearTimeout(restTimer)
  if (fxResting) { fxResting = false; applyFxRate() }
  if (RESTING.has(p)) restTimer = setTimeout(() => { if (RESTING.has(pose)) { fxResting = true; applyFxRate() } }, powerSave ? 10000 : 30000)
}
function setPowerSave(on) { powerSave = !!on; fxFps = -1; noteRest(pose); applyFxRate() }
function setPageHidden(h) { pageHidden = !!h; applyFxRate() }
applyFxRate()

// ---- 多會話：同一個 AI 好幾個對話同時在幹活 ----
// 外殼把 <角色>-sessions.json（{會話id: {pose, event, ts}}）交過來。兩個以上同時在幹活時她「手忙腳亂」：
// 左右兩幀來回切（busy_left / busy_right；三個以上換更崩潰的 swamped_*），每個對話一張小卡片演它正在做的事，
// 她轉向哪邊，哪邊的卡片就亮。幹完的卡片打綠勾、出錯的變紅抖一下，停幾秒後消失；有對話在等你回答時她換成「等你回答」
const sessions = {}         // 角色 → {會話id: {pose, event, ts}}
const SESSION_DONE_SHOW = 4  // 幹完 / 出錯的卡片停幾秒
const SESSION_FLIP = 1500    // 左右兩幀多久換一次
let multi = null             // 正在演：{ side, flipTimer, cards: Map(會話id → {el, pose, shownAt, pending}), order: [會話id] }

function setSessions(id, map) {
  if (id === 'current') id = charId
  sessions[id] = map || {}
  refreshMulti()
}
function sessionKind(e, now) {
  const age = now - Number(e.ts || 0)
  if (e.pose === 'asking') return age < 600 ? 'ask' : null
  if (e.pose === 'happy' || e.pose === 'proud') return age < SESSION_DONE_SHOW ? 'done' : null
  if ((e.pose === 'oops' || e.pose === 'surprised') && e.event === 'Stop') return age < SESSION_DONE_SHOW ? 'error' : null
  if (e.pose === 'idle' || e.pose === 'sleeping') return null
  return age < STUCK_AFTER / 1000 ? 'work' : null   // 一輪中途某個工具出錯：還在幹活，只是卡片變紅
}
// 當前角色要演的會話：她自己的，加上她響應的各家 AI 的（會話 id 各家不重複，直接合在一起）
function currentSessions() {
  const out = { ...(sessions[charId] || {}) }
  for (const [host, map] of Object.entries(sessions)) if (standsIn(host)) Object.assign(out, map)
  return out
}
function refreshMulti() {
  const map = currentSessions(), now = Date.now() / 1000
  const live = Object.entries(map).map(([sid, e]) => [sid, e, sessionKind(e, now)]).filter(x => x[2])
  const busy = live.filter(x => x[2] === 'work' || x[2] === 'ask').length
  if (!multi && (busy < 2 || egg || farewellLine !== null || updatingNow)) return
  // 只剩一個（或沒有）對話在幹活：等幹完 / 出錯的卡片演完（幾秒），她就恢復成平常一個對話的樣子
  if (multi && busy < 2 && !live.some(x => x[2] === 'done' || x[2] === 'error')) return endMulti()
  if (!multi) startMulti()
  lastActive = Date.now()
  // 卡片順序固定（先來的在前），不會跳來跳去；最多 4 張，多的顯示「+N」
  for (const [sid] of live) if (!multi.order.includes(sid)) multi.order.push(sid)
  multi.order = multi.order.filter(sid => live.some(x => x[0] === sid))
  const shown = multi.order.slice(0, 4)
  const slots = shown.length <= 2 ? [[-6, 92], [190, 92]] : [[-6, 34], [190, 34], [-6, 152], [190, 152]]
  for (const [sid, c] of multi.cards) if (!shown.includes(sid)) { c.el.classList.remove('on'); setTimeout(() => c.el.remove(), 400); multi.cards.delete(sid) }
  shown.forEach((sid, i) => {
    const [, e, kind] = live.find(x => x[0] === sid)
    let c = multi.cards.get(sid)
    if (!c) {
      c = { el: document.createElement('div'), pose: null, shownAt: 0 }
      c.el.className = 'scard'; c.el.innerHTML = '<svg></svg><div class="badge">✓</div>'
      $('cards').appendChild(c.el); multi.cards.set(sid, c)
      requestAnimationFrame(() => c.el.classList.add('on'))
    }
    c.el.style.left = slots[i][0] + 'px'; c.el.style.top = slots[i][1] + 'px'
    c.side = i % 2 ? 'right' : 'left'
    flipCard(c)
    c.el.classList.toggle('done', kind === 'done')
    c.el.classList.toggle('ask', kind === 'ask')
    const bad = kind === 'error' || e.pose === 'oops'
    if (bad && !c.el.classList.contains('error')) c.el.classList.add('error')
    if (!bad) c.el.classList.remove('error')
    setCardPose(c, kind === 'done' ? 'happy' : e.pose)
  })
  const extra = multi.order.length - shown.length
  $('more').textContent = extra > 0 ? `+${extra}` : ''
  $('more').classList.toggle('on', extra > 0)
  multi.busy = busy
  multi.asking = live.some(x => x[2] === 'ask')

  clearTimeout(multi.recheck); multi.recheck = setTimeout(refreshMulti, 1000)

// 卡片換內容：同一張卡片至少停 1.2 秒，快的工具不會閃
function setCardPose(c, p) {
  if (c.pose === p) return
  clearTimeout(c.pending)
  const wait = c.shownAt + 1200 - Date.now()
  if (wait > 0) { c.pending = setTimeout(() => setCardPose(c, p), wait); return }
  c.pose = p; c.shownAt = Date.now()
  const svg = c.el.querySelector('svg')
  svg.setAttribute('viewBox', `0 0 ${CrossFx.CW} ${CrossFx.CH}`)
  svg.innerHTML = CrossFx.cardProp(p)
  try {   // 只留道具本身：按它實際佔的範圍裁。沿路徑移動的小東西（畫畫的筆刷）原點在畫布角上，量的時候先藏起來
    const moving = [...svg.querySelectorAll('animateMotion')].map(a => a.parentNode)
    moving.forEach(n => n.setAttribute('display', 'none'))
    const b = svg.getBBox(), pad = 8
    moving.forEach(n => n.removeAttribute('display'))
    if (b.width > 0) svg.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + pad * 2} ${b.height + pad * 2}`)

// 思考雲是畫在她右上方的，小尾巴朝左下指向她：卡片在她左邊時左右翻過來，小尾巴才朝著她（有字的卡片不翻）

  const cloud = c.pose && CrossFx.cardProp(c.pose) === CrossFx.cardProp('thinking')
  c.el.querySelector('svg').style.transform = cloud && c.side === 'left' ? 'scaleX(-1)' : ''
}
function startMulti() {
  clearTimeout(thinkTimer); clearTimeout(pending); clearTimeout(revertTimer); clearTimeout(stuckTimer)

  $('fx').classList.add('hide')
  multi.flipTimer = setInterval(() => { if (multi && !multi.asking) { multi.side = multi.side === 'left' ? 'right' : 'left'; multiPose() } }, SESSION_FLIP)
  chatterLater()
}
// 多會話的臺詞：剛手忙腳亂時、升級成太忙時、有對話開始等你回答時各說一句（臺詞在 character.json 的 busy / swamped / asking），4 秒後收起
// 一直忙著的時候（比如好幾個 Codex 對話跑很久）：隔 35～55 秒再嘟囔一句，不然開頭那句說完就一直不吭聲

  multi.chatter = setTimeout(() => {

}

}

  else {
    const p = `${multi.busy >= 3 ? 'swamped' : 'busy'}_${multi.side}`
    if (pose !== p) { setPose(p, true); $('fx').classList.add('hide') }
  }

  const left = Object.values(currentSessions()).filter(e => sessionKind(e, Date.now() / 1000) === 'work' || sessionKind(e, Date.now() / 1000) === 'ask')
  show(left.length ? left[0].pose : 'idle', true)
  watchStuck()

// 收到狀態後怎麼處理的（反饋「AI 幹活時她沒反應」用）：最近 40 條，只有角色、事件名、姿態和結論，由 diagnoseDisplay 交出去。
// 結論：shown 演了 / not-current 不是當前角色（只記下狀態）/ egg 正在演彩蛋 / multi 正在演多會話 / shaking 正被甩著 / no-pose 沒有姿態
const petVerdicts = []
function noteVerdict(id, s, verdict) {

  if (petVerdicts.length > 40) petVerdicts.shift()
}
// 反饋時外殼調一次：她現在顯示成什麼樣（只有名字和開關，不含路徑）
function diagnoseDisplay() {
  const file = img => decodeURIComponent((img.getAttribute('src') || '').split(/[?#]/)[0].split('/').pop())
  return {
    char: charId, pose, skin: manifest?.characters?.[charId]?.skin || '',

function applyCharState(id, s) {

  const own = id                      // 事件原本屬於哪家 AI：先按它記下狀態，切回那家的角色時看到的才是最新的
  charState[own] = s
  if (standsIn(id)) id = charId       // 代演（reactTo）：別家 AI 的狀態當成她自己的（多個會話同時幹活時，由 refreshMulti 合併）
  charState[id] = s
  if (egg) { noteVerdict(own, s, 'egg'); if (egg.host === own && s.pose && s.pose !== 'idle') endEgg(); return }
  if (id !== charId || !s.pose) { noteVerdict(own, s, s.pose ? 'not-current' : 'no-pose'); return }
  lastActive = Date.now()
  if (multi) { noteVerdict(own, s, 'multi'); return }   // 正在演多會話：她的樣子由各對話的狀態決定（refreshMulti），這裡不動
  if (Date.now() < shakingUntil && s.event !== 'Stop') { noteVerdict(own, s, 'shaking'); return }
  noteVerdict(own, s, 'shown')   // 正被甩著：先只記下狀態，甩停了 resumeWork 回到最新的活上（不然暈和幹活來回閃）
  clearTimeout(thinkTimer)
  watchStuck()
  const ev = s.event || ''
  if (s.pose === 'oops' || (ev === 'Stop' && s.pose === 'surprised')) lastTrouble[id] = Date.now()
  else if (ev === 'Stop' && (s.pose === 'happy' || s.pose === 'proud')) lastTrouble[id] = 0  // 最後順利完成了，不算
  // 工具動作被緊跟著的「思考」蓋掉時，狀態裡會捎帶上它（after）：沒演過的話先演，停夠了再思考

  } else if (ev === 'Stop' && pendingCelebration[id]?.afterWork && !sulking && !angerLevel(angerNow())) {
    // 幹活途中額度重新整理了（重置卡 / 換套餐 / 充值）：幹完不演普通的開心，演 reset / 吃飯
    clearTimeout(pending)
    shownAt = 0
    celebrate(id, pendingCelebration[id].ev)
  } else if (ev === 'Stop' && (s.pose === 'happy' || s.pose === 'proud') && !sulking && angerLevel(angerNow())) {
    // 幹活時被甩、憋著的火還沒消：幹完不慶祝，直接按火氣生氣，說「幹活時被你晃」的那套臺詞（秋後算賬）
    clearTimeout(shakeEndTimer)
    react('work')

  }
}

// ---- 額度裡的「社群梗」時刻 ----
// GPT：某個額度視窗在預定重置時間之前突然恢復一大截（官方 reset / 重置卡）→ reset
// DeepSeek：餘額比上次多了（充值）→ feast 大口吃白飯

const CELEBRATE = { reset: ['reset', 'happy'], feast: ['feast', 'eat'] }
const pendingCelebration = {}
function quotaMemory(update) {
  let m = {}
  try { m = JSON.parse(localStorage.getItem('crosspet-quota-memory')) || {} } catch {}

// 多少算「充值了」：人民幣 0.5，美元按差不多的錢算 0.07

    const prev = m[id] || {}, now = Date.now() / 1000

      // 按幣種分別比（#10）：人民幣、美元都可能有，只是順序變了或幣種不同不算充值；某個幣種多了才算。
      // 上次沒有按幣種的記錄（剛從老版本升級）：只記下來，不比，免得拿美元和人民幣的數字相減
      if (feastByCurrency(prev.balances, q.balances)) ev = 'feast'
      m[id] = { ...(m[id] || prev), balances: q.balances, balance: q.balance }
      return
    }
    const bal = typeof q.balance === 'number' ? q.balance : parseFloat(((q.text || '').match(/[¥$]\s*([\d.]+)/) || [])[1])

function celebrate(id, ev) {

  // 正在幹活：額度記錄是 AI 回覆的半路寫下的，這時演會被緊跟著的幹活動作蓋掉，看不見——留到這一輪幹完（Stop）再演

  delete pendingCelebration[id]
  const [own, fallback] = CELEBRATE[ev]
  const p = hasPose(own) ? own : fallback
  show(p, true)
  say(pick(linesOf(own) || linesOf(p) || ['']))
  clearTimeout(revertTimer)
  revertTimer = characterTimeout(() => { setPose(restPose()); say('') }, 6500)
}

// GPT 額度：外殼交來問 Codex 服務得到的原始額度（見 codex-quota.js），排好版再走 setQuota
function setCodexQuota(p) { setQuota('gpt', p ? CodexQuota.view(p, Date.now() / 1000) : null) }
function setQuota(id, q) {
  const wasLow = quota[id]?.low
  quota[id] = q
  const ev = quotaEvent(id, q)
  // 官方宣佈之後真的重置了：額度下方那一行收起。開發者控制台演「額度提前 reset」用的是假額度，不算（不然真實的宣佈會被當成已經執行了）
  if (ev === 'reset' && id === 'gpt' && !devActive) codexResetSeenAt = Date.now() / 1000
  if (ev) celebrate(id, ev)
  if (egg) return
  if (id === charId || quotaAggregate || standsIn(id)) renderQuota()   // 聚合 / 代演時別家額度變了也要重畫
  if (id !== charId) return
  if (q?.low && pose === 'idle') { setPose('tired'); if (!wasLow) say(pick(linesOf('tired') || [''])) }

// x、y：外殼交來的點選位置（網頁座標，已經除掉人物大小的縮放）；不帶座標時和以前一樣
function handleClick(kind, x, y) {
  const card = $('newsCard')

    const r = card.getBoundingClientRect()
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {   // 點在卡片上：按鈕照按鈕辦，空白處什麼都不做（不摸頭）
      const action = document.elementFromPoint(x, y)?.closest('[data-action]')?.dataset.action
      if (action === 'news-open') { hideNews(); toShell({ openSettings: 'news' }) }
      else if (action === 'news-close') hideNews()
      return
    }
  }
  if (egg) { catchEgg(); return }
  lastActive = Date.now()
  if (kind === 'pat' && Math.random() < EGG_CLICK_CHANCE && playEgg(true)) return
  if (pose === 'sleeping') { show('yawn', true); say('唔…你回來啦'); return }
  if (kind === 'pat' && (sulking || angerNow() >= 20)) { coaxHer(); return }   // 生著氣的時候摸她 = 哄她
  const pokePose = char()?.pokePose && hasPose(char().pokePose) ? char().pokePose : 'surprised'
  show(kind === 'poke' ? pokePose : 'pat', true)

// ---- 甩她 / 紅溫 ----
// 按住她快速來回甩，紅溫值往上加（甩 1 秒左右不耐煩，3～4 秒紅溫）：
// 20 不耐煩（annoyed）→ 45 鼓臉（puffed）→ 75 紅溫（redhot，冒蒸汽、發抖），紅溫後背過身去賭氣（sulk）。
// 生氣時摸她就是哄（coaxed）：賭氣時摸三下原諒你（forgiven），沒到紅溫時摸一下降一檔。紅溫值不管它會慢慢降
let anger = 0, angerAt = Date.now(), sulking = false, coax = 0, sulkTimer = null, shakeEndTimer = null

}

// 按現在的紅溫值做反應

function react(afterWork) {
  if (angerBlocked()) return
  const lv = angerLevel(angerNow())

  if (sulking) { show('sulk', true); return }
  const said = () => { if (afterWork) { const l = linesOf('work' + lv[0].toUpperCase() + lv.slice(1)); if (l) say(pick(l)) } }
  if (lv !== 'redhot') { show(lv, true); said(); return }
  sulking = true; coax = 0
  show('redhot', true)
  said()
  clearTimeout(sulkTimer)

    if (!sulking) return
    show('sulk', true)
    // 賭氣太久沒人哄：自己慢慢消氣（不再說話，回到平常）
    sulkTimer = setTimeout(() => { if (sulking) { sulking = false; anger = 30; angerAt = Date.now(); show('idle', true) } }, 45000)
  }, 3500)
}
// 外殼檢測到正在被甩（按住快速來回拖）時隔一會兒調一次；停下來就按紅溫值反應。
// AI 正在幹活時被甩：暈著抱怨一句，停手就回去幹活；火憋著，幹完不慶祝、直接按火氣生氣（見 applyCharState 的 Stop）。
// 在等你回答：不切走提問的樣子，只催你一句。多會話手忙腳亂：小卡片被甩得東倒西歪
function shaken() {
  if (egg || tucked || farewellLine !== null || updatingNow || devHeld()) return
  lastActive = Date.now()
  addAnger(7)
  if (multi) { complain('shakeMulti', ['我已經夠亂了！']); wobbleCards(); return }
  const ai = aiActivity()
  if (ai === 'asking') { complain('shakeAsk', ['別晃啦，快回答我呀！']); return }
  show('dizzy', true)   // 已經在暈也再調一次：重新計「暈」的 3 秒，一直甩就一直暈，不會中途閃回待機

// 甩停了：回到手上的活（AI 最新的那個動作；不換臺詞，抱怨還留在氣泡裡）
function resumeWork() {

  const p = charState[charId].pose

  shownAt = Date.now()
}
// AI 現在在幹嘛：'asking'（等你回答）/ 'work'（幹活）/ null（閒著）。看 AI 寫來的最新狀態，太久沒動靜的不算

let pluginTold = false
function setPluginUpdates(list) {
  const tip = (list || []).map(p => window.PluginUpdate && PluginUpdate.advice(p)).find(Boolean)

  pluginTold = true
  let tries = 0
  const attempt = () => {
    // 閒著才說：不在幹活、沒在演彩蛋、沒在說別的話；等不到就過一會兒再看，最多等十來分鐘
    if (pose === 'idle' && !egg && aiActivity() !== 'work' && $('bubble').classList.contains('hide')) { say(tip.say); setTimeout(() => { if ($('bubble').textContent === tip.say) say('') }, 9000); return }

}

const complainedAt = {}

function complain(key, fallback) {

}

// ---- 開發者控制台用（右鍵「開發者控制台…」）----
// devShow：演某個角色的某個姿態（可指定某一張圖）並保持住，閒置動作、睡覺、自動彩蛋、換圖都先停下
let devHoldUntil = 0, devActive = false

function devShow(id, p, line, frameUrl, holdMs = 10 * 60 * 1000) {
  devActive = true

  if (charId !== id) {
    const target = manifest.characters[id]
    if (target?.egg) {  // 彩蛋角色不能直接切換，按彩蛋流程那樣換上
      charId = id; pose = null; currentUrl = ''
      applyLook(target); $('caption').textContent = target.name
      document.documentElement.style.setProperty('--aura', target.aura || '#bcd4ff')
    } else {
      setCharacter(id, true)

      return
    }
  }

  say(line || '')
}
function devRelease() {
  devHoldUntil = 0; devActive = false
  if (egg) return
  const c = manifest?.characters?.[charId]
  if (c?.egg) { charId = null; setCharacter(c.host || Object.keys(manifest.characters).find(k => !manifest.characters[k].egg), true); return }
  setPose(restPose()); say('')
}
function devStatus() {

    image: currentUrl.split('/').slice(-2).join('/'), usesFallback: !!(pose && !char()?.poses?.[pose]),
    fx: (char()?.fx || {})[pose] || null, quota: quota, bubble: $('bubble').classList.contains('hide') ? '' : $('bubble').textContent,
    frames: frames.length, fallback: POSE_FALLBACK, transient: TRANSIENT }
}

// ---- 閒著的時候：偶爾哼歌 / 伸懶腰 / 打哈欠，太久沒動靜就睡 ----
setInterval(() => {
  if (devHeld() || egg || (pose !== 'idle' && pose !== 'tired')) return
  const quiet = Date.now() - lastActive
  if (quiet > SLEEP_AFTER) { setPose('sleeping'); say(pick(linesOf('sleeping') || [''])); return }
  if (Math.random() > .42) return
  const builtin = ['hum', 'stretch', ...(quiet > 3 * 60 * 1000 ? ['yawn'] : [])]
  const own = (char()?.idleActions || []).filter(hasPose)
  const pool = own.length ? [...own, ...own, ...builtin] : builtin  // 有專屬動作時優先用專屬的
  const a = pick(pool)
  if (!TRANSIENT[a]) TRANSIENT[a] = 4000
  show(a, true)
}, 20000)

// 想得久了換成專屬的「深度思考」：character.json 裡 longThink: { after: 秒, pose: 姿態 }
setInterval(() => {
  const lt = char()?.longThink
  if (!lt || devHeld() || egg || pose !== 'thinking' || !hasPose(lt.pose)) return
  if (Date.now() - poseSince > (lt.after || 20) * 1000) show(lt.pose, true)
}, 1000)

// ---- 彩蛋：角色閒著時，偶爾變成 cos 它的 DeepSeek ----
// 流程：跳出來 → 裝模作樣（一直裝，等你點她）→ 你點一下 → 被識破 → 溜走 → 變回原角色
const EGG_POP_MS = 2200, EGG_CAUGHT_MS = 2000, EGG_BYE_MS = 2200
const EGG_WAIT_MS = 40000           // 一直沒人點，她就得意地自己溜走
const EGG_PRETEND_LINE_MS = 9000    // 裝模作樣時隔一會兒換句臺詞
const EGG_CHANCE_PER_MIN = 1 / 40   // 閒著時每分鐘的觸發機率，約每小時 1~2 次
const EGG_CLICK_CHANCE = 0.03       // 點她時也有一點點機率觸發
let egg = null  // 正在演：{ host, timers, waiting }

// 來拜訪這個角色的彩蛋，按她現在穿的衣服分開：穿原版只出沒寫 hostSkin 的，穿皮膚只出 hostSkin 是這件的
// （皮膚有自己的故事，和原版的彩蛋不混；皮膚沒有自己的彩蛋就不出）。有好幾個就隨機挑一個
function eggFor(host) {
  const skin = manifest.characters[host]?.skin || ''
  const ids = Object.entries(manifest.characters).filter(([, c]) => c.egg && c.host === host && (c.hostSkin || '') === skin).map(([k]) => k)
  return ids.length ? pick(ids) : undefined
}
function clearEggTimers() { egg?.timers.forEach(t => { clearTimeout(t); clearInterval(t) }); if (egg) egg.timers = [] }
function poof(then) {
  const p = $('poof'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go')
  const stage = $('stage'); stage.classList.add('swap')
  setTimeout(() => { then(); stage.classList.remove('swap') }, 330)
}
function eggLine(step) { return pick((char().lines && char().lines[step]) || ['']) }
function eggStep(step) {
  setPose(step)
  document.documentElement.style.setProperty('--aura', char().aura || '#bcd4ff')
}
function playEgg(force) {
  if (egg || tucked || !charId || char()?.egg || $('stage').classList.contains('swap')) return false   // 縮在邊上、正在換角色時不演：彩蛋角色沒有貼邊立繪
  const eggId = eggFor(charId)
  if (!eggId) return false
  if (!force && pose !== 'idle') return false
  const host = charId
  const mine = egg = { host, timers: [], waiting: false }
  hideNews()   // 演彩蛋時「新功能」卡片收起
  clearTimeout(revertTimer); clearTimeout(pending)
  poof(() => {
    if (egg !== mine) return   // 煙還沒散就被收場了（比如剛冒出來就被拖到邊上）
    charId = eggId; pose = null; currentUrl = ''
    const c = char()
    document.documentElement.style.setProperty('--accent', c.accent || '#e0b48a')
    // cos 彩蛋裝成別人（「Claude？」）；對手直接上門的彩蛋（DeepSeek × GLM）用自己的名字
    $('caption').textContent = c.caption || `${manifest.characters[host].name}？`
    renderQuota()
    setPose('pop', true); document.documentElement.style.setProperty('--aura', c.aura || '#bcd4ff'); say(eggLine('pop'))
    egg.timers.push(setTimeout(() => {
      eggStep('pretend'); say(eggLine('pretend'))
      egg.waiting = true
      egg.timers.push(setInterval(() => say(eggLine('pretend')), EGG_PRETEND_LINE_MS))
      // 沒人點：畫了 escape（自己走掉）就用它，沒畫就用 bye。投餵這類彩蛋的 bye 是兩人同框，沒人點時不能用
      egg.timers.push(setTimeout(() => leaveEgg(pick((c.lines && c.lines.escape) || ['沒人發現～下次見！']), c.poses?.escape ? 'escape' : 'bye'), EGG_WAIT_MS))
    }, EGG_POP_MS))
  })
  return true
}
function catchEgg() {
  if (!egg || !egg.waiting) return
  egg.waiting = false
  clearEggTimers()
  eggStep('caught'); say(eggLine('caught'))
  egg.timers.push(setTimeout(() => leaveEgg(eggLine('bye')), EGG_CAUGHT_MS))
}
function leaveEgg(line, step = 'bye') {
  if (!egg) return
  egg.waiting = false
  clearEggTimers()
  eggStep(step); say(line)
  egg.timers.push(setTimeout(() => endEgg(), EGG_BYE_MS))
}
// 立刻收場，不演 bye、不冒煙：被拖到邊上時用
function quitEggNow() {
  if (!egg) return
  const host = egg.host
  clearEggTimers()
  egg = null
  charId = host; pose = null; currentUrl = ''
  const c = char()
  applyLook(c)
  setBlinkSrc(c.blink)
  $('caption').textContent = c.name
  say('')
  renderQuota()
}
function endEgg() {
  if (!egg) return
  const host = egg.host
  clearEggTimers()
  egg = null
  poof(() => {
    charId = host; pose = null; currentUrl = ''
    const c = char()
    applyLook(c)
    setBlinkSrc(c.blink)
    $('caption').textContent = c.name
    setPose(restPose(), true); say('')
    renderQuota()
  })
}
// 設定裡可以關掉隨機彩蛋；右鍵「召喚彩蛋」不受影響
let eggsEnabled = true
function setEggsEnabled(on) { eggsEnabled = !!on }
setInterval(() => { if (eggsEnabled && !devHeld() && !devActive && !egg && Math.random() < EGG_CHANCE_PER_MIN) playEgg(false) }, 60000)

// ---- 生動一點：同一狀態有多張圖時停留久了換一張；有眨眼幀就偶爾眨眼 ----
setInterval(() => {
  const frames = framesFor(pose)
  if (!devHeld() && frames.length > 1 && Date.now() - poseSince > 8000) {
    poseSince = Date.now()
    showImage(pick(frames.filter(u => u !== currentUrl)))
  }
}, 2000)
;(function blinkLoop() {
  setTimeout(() => {
    const blink = $('blink'), c = char()
    // 只在顯示的正是眨眼幀對應的那張 idle、而且換圖淡入已經結束時眨眼，否則會和別的圖疊在一起
    if (c && c.blink && c.blinkBase && (pose === 'idle' || pose === 'listening') && currentUrl === c.blinkBase
        && active.getAttribute('src') === c.blinkBase && !spare.classList.contains('on') && Date.now() - swappedAt > 600) {
      blink.classList.add('on')
      setTimeout(() => blink.classList.remove('on'), 140)
    }
    blinkLoop()
  }, 3000 + Math.random() * 3500)
})()
</script>
</body></html>
